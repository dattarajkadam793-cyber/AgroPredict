<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest or Not</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eef9ee;
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 400px;
            padding: 30px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 100, 0, 0.15);
        }

        .form-title {
            text-align: center;
            padding: 12px;
            margin-bottom: 20px;
            /* border-radius: 25px; */
            color: rgb(6, 0, 0);
            font-weight: bold;
            font-size: 18px;
            background: linear-gradient(to right, #e6fdf0, #e8fbf1);
        }

        label {
            font-weight: bold;
            color: #2f4f2f;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #b7e0b7;
            border-radius: 8px;
            background-color: #f7fff7;
            font-size: 14px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #3cb371, #66cdaa);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: linear-gradient(to right, #2e8b57, #5dbb8a);
        }
    </style>
</head>

<body>
    <div class="form-container">
        <div class="form-title">Harvest Readiness Assessment Tool</div>

        <form action="/harvestPredict" method="post">
            <label>Brix %</label>
            <input type="number" name="brix">

            <label>Pol %</label>
            <input type="number" name="pol">

            <label>Purity</label>
            <input type="number" name="purity">

            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
